name: Build and deploy App Service apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:api
      - name: Build frontend
        run: npm run build:web
        env:
          VITE_API_URL: https://${{ vars.AZURE_API_APP_NAME }}.azurewebsites.net
      - run: npm run package:deploy
      - name: Archive deployment packages
        run: |
          (cd .artifacts/api && zip -qr ../api.zip .)
          (cd .artifacts/web && zip -qr ../web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-packages
          path: .artifacts/*.zip

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment-packages
          path: deployment-packages
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API
        run: bash scripts/deploy-onedeploy.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_API_APP_NAME }}' deployment-packages/api.zip
      - name: Deploy frontend
        run: bash scripts/deploy-onedeploy.sh '${{ vars.AZURE_RESOURCE_GROUP }}' '${{ vars.AZURE_WEB_APP_NAME }}' deployment-packages/web.zip
      - name: Verify deployed integration
        run: node scripts/smoke-test.mjs
        env:
          API_URL: https://${{ vars.AZURE_API_APP_NAME }}.azurewebsites.net
          WEB_URL: https://${{ vars.AZURE_WEB_APP_NAME }}.azurewebsites.net